# fly.toml app configuration file generated for algo-kf3yha on 2026-11-25T18:32:00Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'algo-kf3yha'
primary_region = 'ams'

[build]
[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
